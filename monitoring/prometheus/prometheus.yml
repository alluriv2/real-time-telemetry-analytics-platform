global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: weather-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: docker
    static_configs:
      - targets: [cadvisor:8080]
